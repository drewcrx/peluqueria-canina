services:
  postgres:
    image: postgres:16-alpine
    container_name: peluqueria-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peluqueria
      POSTGRES_PASSWORD: peluqueria_dev_password
      POSTGRES_DB: peluqueria_saas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
